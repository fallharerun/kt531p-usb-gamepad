[env:seeed_xiao_rp2040]
; プラットフォームはコミットで固定する。このコミットが arduino-pico のコミットも
; 固定している（6.0.0 の 4 コミット先、9a0bc356）。ファームウェアは send_now() の
; 待ち方、EEPROM.commit() の戻り値、SerialUSB::write の待ち方など、コアの公開 API
; では保証されていない挙動に依存しているので、版を上げるときは確かめ直すこと。
platform = https://github.com/maxgerhardt/platform-raspberrypi.git#9c167c6b8aac4f4cfa6d55a0c4e5b848795150c0
board = seeed_xiao_rp2040
board_build.core = earlephilhower
framework = arduino

monitor_speed = 115200

; USB スタックは Pico SDK（デフォルト）。build_flags は空のままにする。
;   -DUSE_TINYUSB → Joystick.h が使えなくなる
;   -DCFG_TUSB_CONFIG_FILE= → tusb_config.h の include が壊れてビルド不能
;
; board_build.filesystem_size も指定しない。LittleFS は未使用で、較正値は
; EEPROM エミュレーション（コアが標準で確保）に保存しているため不要。
