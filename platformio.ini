[env:seeed_xiao_rp2040]
platform = https://github.com/maxgerhardt/platform-raspberrypi.git
board = seeed_xiao_rp2040
board_build.core = earlephilhower
framework = arduino

monitor_speed = 115200

; USB スタックは Pico SDK（デフォルト）。build_flags は空のままにする。
;   -DUSE_TINYUSB → Joystick.h が使えなくなる
;   -DCFG_TUSB_CONFIG_FILE= → tusb_config.h の include が壊れてビルド不能
;
; board_build.filesystem_size も指定しない。LittleFS は未使用で、較正値は
; EEPROM エミュレーション（コアが標準で確保）に保存しているため不要。
